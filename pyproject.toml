[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openjev"
version = "0.1.0"
description = "Open-source, Jev-compatible System One decision engine with a Claude Code style REPL. Typed decisions (Choice / Score / Noul) from open models in one forward pass."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "GPT-AGI" }]
keywords = [
  "jev", "typesafe", "system-one", "decision-model", "llm", "logprobs",
  "classification", "routing", "guardrail", "agent", "repl",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.5",
  "rich>=13.0",
  "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
hf = ["torch>=2.1", "transformers>=4.40", "accelerate"]
mlx = ["mlx-lm>=0.10"]
vllm = ["vllm>=0.6"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
experiments = ["typesafe-sdk>=0.7", "matplotlib>=3.8", "numpy", "python-dotenv", "pillow"]
dev = ["pytest", "ruff", "pillow"]

[project.scripts]
openjev = "openjev.cli.main:main"

[project.urls]
Homepage = "https://github.com/GPT-AGI/OpenJev"
Repository = "https://github.com/GPT-AGI/OpenJev"
Issues = "https://github.com/GPT-AGI/OpenJev/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/openjev"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E731", "E741", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
